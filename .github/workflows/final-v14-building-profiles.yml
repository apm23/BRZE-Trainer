name: Final V14 Building Profiles Clean Diagnostics

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.final-v14-building-profiles-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate locked base + V14 profiled Unit Changer
        run: |
          python tools/prepare_merged_v3_wolfstock.py
          python tools/finalize_v10_ui_safe.py
          python tools/finalize_v11_transition_safe.py
          python tools/finalize_v13_integrated.py
          python tools/finalize_v14_building_profiles.py
          python tools/v14_generator_repair.py
          python tools/v14_ui_compile_repair.py

      - name: Verify V14 architecture
        shell: pwsh
        run: |
          $m=Get-Content MergedProgram.cs -Raw
          $ui=Get-Content FinalV14MainForm.cs -Raw
          $uc=Get-Content UnitChangerCore.cs -Raw
          $pp=Get-Content PausePeasantCore.cs -Raw
          foreach($x in @('internal sealed class LegacyMainForm : Form','RVA_PLAYER_PTR=0x4416A0','RVA_LOCAL_ID=0x4416D0')){if($m -notmatch [regex]::Escape($x)){throw "Base invariant missing: $x"}}
          foreach($x in @('ClientSize=new Size(1720,820)','ScrollBars=ScrollBars.Vertical','#if RAW_STATUS','BuildingProfile[] Profiles','new("DRAGON","Dojo",5,8)','new("SERPENT","Tavern",24,29)','new("LOTUS","Forge",40,30)','new("WOLF","Combat Pit",51,46)','UnitChangerCore.ConfigureProfiles(profileOn,profileOut)','active buildings:','SelectionCore.Tick(peasant.Checked)','PausePeasantCore.Tick(pausePeasant.Checked)','REFRESH TRAINER')){if($ui -notmatch [regex]::Escape($x)){throw "V14 UI invariant missing: $x"}}
          foreach($x in @('PROFILE_COUNT=12','ProfileInput={5,5,5,24,24,24,40,40,40,51,51,51}','ProfileNativeOut={8,0,1,29,21,23,30,38,41,46,48,49}','ConfigureProfiles(bool[,] enabled,uint[,] outputs)','RVA_TRAIN_MAP=0x0D69F6','RVA_COMPLETION_CALL=0x0D5E08','RVA_POST_REGISTER_CALL=0x0D5EA4','RVA_CREATE_UNIT=0x0D6A88','MapperStock={0x55,0x8B,0xEC,0x8B,0x81,0x58,0x02,0x00,0x00}','12 native training-building fingerprints','unmatched buildings remain native')){if($uc -notmatch [regex]::Escape($x)){throw "V14 core invariant missing: $x"}}
          foreach($x in @('RVA_PEASANT_CREATION=0x467AF4','RVA_LOCAL_ID=0x4416D0','RestoreUnlocked()')){if($pp -notmatch [regex]::Escape($x)){throw "Pause core invariant missing: $x"}}
          if($uc -match 'public static void Reset\(\)\{\s*public static void Reset'){throw 'Duplicate Reset marker survived generator'}

      - name: Compile CLEAN smoke
        run: dotnet build MergedTrainerV14.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false

      - name: Compile DIAGNOSTICS smoke
        run: dotnet build MergedTrainerV14.csproj -c Release -r win-x86 -p:DefineConstants=RAW_STATUS -p:DebugType=None -p:DebugSymbols=false

      - name: Publish CLEAN standalone
        run: |
          dotnet publish MergedTrainerV14.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean
          Move-Item publish-clean/BRZE-Trainer-FINAL-V14.exe publish-clean/BRZE-Trainer-FINAL-V14-Clean.exe

      - name: Publish DIAGNOSTICS standalone
        run: |
          dotnet publish MergedTrainerV14.csproj -c Release -r win-x86 --self-contained true -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag
          Move-Item publish-diag/BRZE-Trainer-FINAL-V14.exe publish-diag/BRZE-Trainer-FINAL-V14-Diagnostics.exe

      - name: Publish CLEAN small
        run: |
          dotnet publish MergedTrainerV14.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean-small
          Move-Item publish-clean-small/BRZE-Trainer-FINAL-V14.exe publish-clean-small/BRZE-Trainer-FINAL-V14-Clean-Small.exe

      - name: Publish DIAGNOSTICS small
        run: |
          dotnet publish MergedTrainerV14.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag-small
          Move-Item publish-diag-small/BRZE-Trainer-FINAL-V14.exe publish-diag-small/BRZE-Trainer-FINAL-V14-Diagnostics-Small.exe

      - name: Report hashes and sizes
        shell: pwsh
        run: |
          foreach($f in @('publish-clean/BRZE-Trainer-FINAL-V14-Clean.exe','publish-diag/BRZE-Trainer-FINAL-V14-Diagnostics.exe','publish-clean-small/BRZE-Trainer-FINAL-V14-Clean-Small.exe','publish-diag-small/BRZE-Trainer-FINAL-V14-Diagnostics-Small.exe')){$x=Get-Item $f;Write-Host ($x.Name+' BYTES='+$x.Length);Get-FileHash $x.FullName -Algorithm SHA256}

      - name: Upload V14 four-pack
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-FINAL-V14-BuildingProfiles-Clean-Diagnostics
          compression-level: 0
          path: |
            publish-clean/BRZE-Trainer-FINAL-V14-Clean.exe
            publish-diag/BRZE-Trainer-FINAL-V14-Diagnostics.exe
            publish-clean-small/BRZE-Trainer-FINAL-V14-Clean-Small.exe
            publish-diag-small/BRZE-Trainer-FINAL-V14-Diagnostics-Small.exe
