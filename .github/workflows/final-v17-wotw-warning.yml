name: Final V17 WotW Only Warning Clean Diagnostics

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.final-v17-wotw-warning-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate locked V14 core + V15 compact + V16 catalog + V17 warning policy
        run: |
          python tools/prepare_merged_v3_wolfstock.py
          python tools/finalize_v10_ui_safe.py
          python tools/finalize_v11_transition_safe.py
          python tools/finalize_v13_integrated.py
          python tools/finalize_v14_building_profiles.py
          python tools/v14_generator_repair.py
          python tools/v14_ui_compile_repair.py
          python tools/finalize_v15_compact_ui.py
          (Get-FileHash UnitChangerCore.cs -Algorithm SHA256).Hash | Set-Content v14-core-before.sha
          python tools/finalize_v16_unit_catalog.py
          python tools/finalize_v17_wotw_warning.py

      - name: Verify V17 WotW-only policy and unchanged V14 core
        shell: pwsh
        run: |
          $ui=Get-Content FinalV17MainForm.cs -Raw
          $uc=Get-Content UnitChangerCore.cs -Raw
          $before=(Get-Content v14-core-before.sha -Raw).Trim()
          $after=(Get-FileHash UnitChangerCore.cs -Algorithm SHA256).Hash
          if($before -ne $after){throw 'V17 changed UnitChangerCore; release must remain UI/catalog-only'}
          foreach($x in @(
            'Text="BRZE Trainer — V17 Clean"',
            'Text="BRZE Trainer — V17 Diagnostics"',
            'RED = WOTW RELEASE ONLY',
            'readonly Label unitRiskWarning',
            'WotW-only:',
            'hindari di Kenji Journey/story map',
            'H("SPECIAL / UNIQUE")',
            'H("CLASSIC HEROES / STORY")',
            'U(85,"Hero Arah")',
            'U(89,"Hero Grayback")',
            'U(92,"Hero Kenji")',
            'U(105,"Hero Otomo")',
            'U(107,"Hero Shinja")',
            'U(114,"Hero Zymeth")',
            'H("⚠ WOTW UNITS — RISK",true)',
            'U(116,"Dragon Chakram Maiden",true)',
            'U(121,"Serpent Witch",true)',
            'U(127,"Wolf Dryad",true)',
            'H("⚠ WOTW HEROES / STORY — RISK",true)',
            'U(140,"Hero Taro",true)',
            'U(141,"Hero Teppo",true)',
            'U(143,"Hero Yvaine",true)'
          )){if($ui -notmatch [regex]::Escape($x)){throw "V17 invariant missing: $x"}}
          foreach($bad in @(
            'U(85,"Hero Arah",true)',
            'U(89,"Hero Grayback",true)',
            'U(92,"Hero Kenji",true)',
            'U(105,"Hero Otomo",true)',
            'U(107,"Hero Shinja",true)',
            'U(114,"Hero Zymeth",true)',
            'Risky Unit Confirmation',
            'requires manual confirmation before spawning',
            'U(145,','U(146,','U(147,','U(148,','U(149,','U(150,','U(151,','U(152,','U(153,','U(154,'
          )){if($ui -match [regex]::Escape($bad)){throw "V17 forbidden fragment present: $bad"}}
          foreach($x in @(
            'PROFILE_COUNT=12',
            'ProfileInput={5,5,5,24,24,24,40,40,40,51,51,51}',
            'ProfileNativeOut={8,0,1,29,21,23,30,38,41,46,48,49}',
            'RVA_COMPLETION_CALL=0x0D5E08',
            'RVA_POST_REGISTER_CALL=0x0D5EA4',
            'RVA_CREATE_UNIT=0x0D6A88',
            'MapperStock={0x55,0x8B,0xEC,0x8B,0x81,0x58,0x02,0x00,0x00}'
          )){if($uc -notmatch [regex]::Escape($x)){throw "V14 proven core invariant missing in V17: $x"}}

      - name: Compile CLEAN smoke
        run: dotnet build MergedTrainerV17.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false

      - name: Compile DIAGNOSTICS smoke
        run: dotnet build MergedTrainerV17.csproj -c Release -r win-x86 -p:DefineConstants=RAW_STATUS -p:DebugType=None -p:DebugSymbols=false

      - name: Publish CLEAN standalone
        run: |
          dotnet publish MergedTrainerV17.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean
          Move-Item publish-clean/BRZE-Trainer-FINAL-V17.exe publish-clean/BRZE-Trainer-FINAL-V17-Clean.exe

      - name: Publish DIAGNOSTICS standalone
        run: |
          dotnet publish MergedTrainerV17.csproj -c Release -r win-x86 --self-contained true -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag
          Move-Item publish-diag/BRZE-Trainer-FINAL-V17.exe publish-diag/BRZE-Trainer-FINAL-V17-Diagnostics.exe

      - name: Publish CLEAN small
        run: |
          dotnet publish MergedTrainerV17.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean-small
          Move-Item publish-clean-small/BRZE-Trainer-FINAL-V17.exe publish-clean-small/BRZE-Trainer-FINAL-V17-Clean-Small.exe

      - name: Publish DIAGNOSTICS small
        run: |
          dotnet publish MergedTrainerV17.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag-small
          Move-Item publish-diag-small/BRZE-Trainer-FINAL-V17.exe publish-diag-small/BRZE-Trainer-FINAL-V17-Diagnostics-Small.exe

      - name: Report hashes and sizes
        shell: pwsh
        run: |
          foreach($f in @('publish-clean/BRZE-Trainer-FINAL-V17-Clean.exe','publish-diag/BRZE-Trainer-FINAL-V17-Diagnostics.exe','publish-clean-small/BRZE-Trainer-FINAL-V17-Clean-Small.exe','publish-diag-small/BRZE-Trainer-FINAL-V17-Diagnostics-Small.exe')){$x=Get-Item $f;Write-Host ($x.Name+' BYTES='+$x.Length);Get-FileHash $x.FullName -Algorithm SHA256}

      - name: Upload V17 four-pack
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-FINAL-V17-WotW-Only-Warning
          compression-level: 0
          path: |
            publish-clean/BRZE-Trainer-FINAL-V17-Clean.exe
            publish-diag/BRZE-Trainer-FINAL-V17-Diagnostics.exe
            publish-clean-small/BRZE-Trainer-FINAL-V17-Clean-Small.exe
            publish-diag-small/BRZE-Trainer-FINAL-V17-Diagnostics-Small.exe
