name: Append V9 Master Ledger

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.master-v9-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - name: Append V9 milestone if absent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('MASTER_STATE.md')
          s=p.read_text(encoding='utf-8')
          marker='# FINAL V9 UI / PACK — BUILD COMPLETE'
          if marker not in s:
              s += '''\n\n---\n\n# FINAL V9 UI / PACK — BUILD COMPLETE\n\n- UI-only/package milestone built from runtime-proven V8 cores.\n- Two rows of six custom switches: Rice, Water, Yin/Yang, Population, Training, Peasant 3s / Health, Stamina, Horses, Wolves, Reveal, Death Burst.\n- Actions: SINGLE KILL, BUILD NOW, ALL ON, ALL OFF.\n- All runtime telemetry is shown in the central SYSTEM STATUS box.\n- Procedural dark Battle-Realm-style background; high-contrast opaque control/status cards prevent obscured text.\n- Death V6 targeting + V7 Burst/Single remain locked. Reveal Map remains locked. Wolves V8 +0x250 byte=250 remains locked.\n- Final build run `34451899885` SUCCESS, job `102789297707` SUCCESS, artifact `10141910073`.\n- Standalone: 66,020,277 bytes, SHA-256 `496599acbe5a09c4db38721ba621ad59db6a670cfe4885574c5bb0f57cba5f79`.\n- Small: 193,182 bytes, SHA-256 `61917877a1c8df26669b97de9e3b4b8e2c57ee39b54e3b66995981f20dd6113d`; requires .NET 8 Windows Desktop Runtime x86.\n- Default recommendation: Standalone for no-hassle use; Small is optional ultra-compact build.\n- Reference: `reference/current-brze/final-v9-ui-pack-20260910.md`.\n- V9 compilation/package is complete; only final user visual/runtime smoke remains before calling the UI itself runtime-locked.\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit ledger
        shell: bash
        run: |
          if git diff --quiet -- MASTER_STATE.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER_STATE.md
          git commit -m "Lock FINAL V9 UI pack milestone in master state"
          git push origin HEAD:instant-death-v4-hover-telemetry
