name: Selection rectangle throttle 1ms probe fixed
on:
  workflow_dispatch:
  push:
    branches: [ selection-rectangle-throttle-1ms-probe ]
    paths: ['.trigger-selection-rectangle-throttle-1ms-probe']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: selection-rectangle-throttle-1ms-probe
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Hotfix wrapper length
        shell: pwsh
        run: |
          $p = Get-Content Program.cs -Raw
          if ($p -match 'new byte\[23\]') {
            $p = $p.Replace('var code = new byte[23];','var code = new byte[24];')
            Set-Content Program.cs $p -NoNewline
          }
          if ((Get-Content Program.cs -Raw) -notmatch 'new byte\[24\]') { throw 'Hotfix verification failed' }
      - name: Persist hotfix source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix rectangle throttle wrapper length"
            git push origin HEAD:selection-rectangle-throttle-1ms-probe
          }
      - name: Compile smoke
        run: dotnet build BRZETrainer.csproj -c Release -r win-x86
      - name: Publish x86 single-file EXE
        run: dotnet publish BRZETrainer.csproj -c Release -r win-x86 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false -o publish
      - name: Upload fixed rectangle throttle probe
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Selection-Rectangle-Throttle-1ms-Probe-FIXED
          path: publish/BRZE-Trainer.exe
