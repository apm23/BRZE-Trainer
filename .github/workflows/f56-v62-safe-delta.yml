name: F5 F6 v62 safe delta
on:
  workflow_dispatch:
  push:
    paths:
      - '.trigger-f56-v62'
jobs:
  patch:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Patch source
        shell: pwsh
        run: python tools/patch_f56_v62_safe_delta.py
      - name: Compile smoke
        shell: pwsh
        run: dotnet build BRZETrainer.csproj -c Release -r win-x86
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Replace PageUp sentinel writes with safe F5 F6 delta hooks"
            git push
          }
