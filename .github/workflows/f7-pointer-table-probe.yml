name: F7 pointer table patch
on:
  push:
    paths:
      - '.github/workflows/f7-pointer-table-probe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply guarded pointer patch
        run: python tools/patch_f7_pointer.py
      - name: Compile smoke
        run: dotnet build -c Release -p:PlatformTarget=x86
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program.cs
          git commit -m 'Guard F7 pointer scan overflow and reduce polling load'
          git push
