name: Final V15 Compact UI Clean Diagnostics

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.final-v15-compact-ui-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate locked base + V14 proven profiles + V15 compact UI
        run: |
          python tools/prepare_merged_v3_wolfstock.py
          python tools/finalize_v10_ui_safe.py
          python tools/finalize_v11_transition_safe.py
          python tools/finalize_v13_integrated.py
          python tools/finalize_v14_building_profiles.py
          python tools/v14_generator_repair.py
          python tools/v14_ui_compile_repair.py
          python tools/finalize_v15_compact_ui.py

      - name: Verify V15 UI-only architecture
        shell: pwsh
        run: |
          $ui=Get-Content FinalV15MainForm.cs -Raw
          $uc=Get-Content UnitChangerCore.cs -Raw
          foreach($x in @(
            'ClientSize=new Size(1640,720)',
            'content.RowStyles.Add(new RowStyle(SizeType.Absolute,258))',
            'content.SetColumnSpan(statusPanel,2)',
            'readonly ComboBox profileSelect',
            'UNIT CHANGER  //  BUILDING',
            'profileSelect.Items.Add',
            'slotOn[i].Text=""',
            'BuildStatusPanel()',
            '#if RAW_STATUS',
            'UnitChangerCore.ConfigureProfiles(profileOn,profileOut)',
            'SelectionCore.Tick(peasant.Checked)',
            'PausePeasantCore.Tick(pausePeasant.Checked)'
          )){if($ui -notmatch [regex]::Escape($x)){throw "V15 UI invariant missing: $x"}}
          if($ui -match 'profileButtons'){throw 'V15 must not retain oversized profile button grid'}
          foreach($x in @(
            'PROFILE_COUNT=12',
            'ProfileInput={5,5,5,24,24,24,40,40,40,51,51,51}',
            'ProfileNativeOut={8,0,1,29,21,23,30,38,41,46,48,49}',
            'RVA_COMPLETION_CALL=0x0D5E08',
            'RVA_POST_REGISTER_CALL=0x0D5EA4',
            'RVA_CREATE_UNIT=0x0D6A88',
            'MapperStock={0x55,0x8B,0xEC,0x8B,0x81,0x58,0x02,0x00,0x00}'
          )){if($uc -notmatch [regex]::Escape($x)){throw "V14 proven core invariant missing in V15: $x"}}

      - name: Compile CLEAN smoke
        run: dotnet build MergedTrainerV15.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false

      - name: Compile DIAGNOSTICS smoke
        run: dotnet build MergedTrainerV15.csproj -c Release -r win-x86 -p:DefineConstants=RAW_STATUS -p:DebugType=None -p:DebugSymbols=false

      - name: Publish CLEAN standalone
        run: |
          dotnet publish MergedTrainerV15.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean
          Move-Item publish-clean/BRZE-Trainer-FINAL-V15.exe publish-clean/BRZE-Trainer-FINAL-V15-Clean.exe

      - name: Publish DIAGNOSTICS standalone
        run: |
          dotnet publish MergedTrainerV15.csproj -c Release -r win-x86 --self-contained true -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag
          Move-Item publish-diag/BRZE-Trainer-FINAL-V15.exe publish-diag/BRZE-Trainer-FINAL-V15-Diagnostics.exe

      - name: Publish CLEAN small
        run: |
          dotnet publish MergedTrainerV15.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean-small
          Move-Item publish-clean-small/BRZE-Trainer-FINAL-V15.exe publish-clean-small/BRZE-Trainer-FINAL-V15-Clean-Small.exe

      - name: Publish DIAGNOSTICS small
        run: |
          dotnet publish MergedTrainerV15.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag-small
          Move-Item publish-diag-small/BRZE-Trainer-FINAL-V15.exe publish-diag-small/BRZE-Trainer-FINAL-V15-Diagnostics-Small.exe

      - name: Report hashes and sizes
        shell: pwsh
        run: |
          foreach($f in @('publish-clean/BRZE-Trainer-FINAL-V15-Clean.exe','publish-diag/BRZE-Trainer-FINAL-V15-Diagnostics.exe','publish-clean-small/BRZE-Trainer-FINAL-V15-Clean-Small.exe','publish-diag-small/BRZE-Trainer-FINAL-V15-Diagnostics-Small.exe')){$x=Get-Item $f;Write-Host ($x.Name+' BYTES='+$x.Length);Get-FileHash $x.FullName -Algorithm SHA256}

      - name: Upload V15 four-pack
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-FINAL-V15-Compact-Clean-Diagnostics
          compression-level: 0
          path: |
            publish-clean/BRZE-Trainer-FINAL-V15-Clean.exe
            publish-diag/BRZE-Trainer-FINAL-V15-Diagnostics.exe
            publish-clean-small/BRZE-Trainer-FINAL-V15-Clean-Small.exe
            publish-diag-small/BRZE-Trainer-FINAL-V15-Diagnostics-Small.exe
