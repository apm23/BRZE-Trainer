name: Unit Changer Lab v4 Two Output Proof

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.unit-changer-lab-v4-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify V4 keeps V3 base and narrow second-output hook
        shell: pwsh
        run: |
          $p = Get-Content UnitChangerTrainerV4/Program.cs -Raw
          foreach($x in @(
            'RVA_COMPLETION_CALL=0x0D5E08',
            'CompletionCallOriginal={0xE8,0xE9,0x0B,0x00,0x00}',
            'RVA_POST_REGISTER_CALL=0x0D5EA4',
            'PostRegisterCallOriginal={0xE8,0x09,0x78,0xFD,0xFF}',
            'RVA_CREATE_UNIT=0x0D6A88',
            'RVA_ATTACH_UNIT=0x0D231C',
            'RVA_REGISTER_UNIT=0x0AD6B2',
            'RVA_LOCAL_UNIT_NOTIFY=0x1B605D',
            'MapperStock={0x55,0x8B,0xEC,0x8B,0x81,0x58,0x02,0x00,0x00}',
            'pending=0 at every completion attempt',
            'consume pending exactly once',
            'Same per-unit sequence observed in the runtime-proven 4D5E path',
            'V4 TWO-OUTPUT HOOK ACTIVE — V3 output #1 path preserved',
            'SLOT 3–9  LOCKED'
          )) { if($p -notmatch [regex]::Escape($x)) { throw "V4 invariant missing: $x" } }
          foreach($bad in @('WriteCode(moduleBase+RVA_TRAIN_MAP','CreateRemoteThread','clone raw','RVA_CURRENT_UNIT_PTR')) {
            if($p -match [regex]::Escape($bad)) { throw "V4 forbidden pattern: $bad" }
          }

      - name: Compile smoke
        run: dotnet build UnitChangerTrainerV4/UnitChangerTrainerV4.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false

      - name: Publish standalone
        run: |
          dotnet publish UnitChangerTrainerV4/UnitChangerTrainerV4.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-v4
          Move-Item publish-v4/BRZE-Unit-Changer-Lab-v4.exe publish-v4/BRZE-Unit-Changer-Lab-v4-TwoOutputProof.exe

      - name: Publish small
        run: |
          dotnet publish UnitChangerTrainerV4/UnitChangerTrainerV4.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-v4-small
          Move-Item publish-v4-small/BRZE-Unit-Changer-Lab-v4.exe publish-v4-small/BRZE-Unit-Changer-Lab-v4-TwoOutputProof-Small.exe

      - name: Report hashes and sizes
        shell: pwsh
        run: |
          $a = Get-Item publish-v4/BRZE-Unit-Changer-Lab-v4-TwoOutputProof.exe
          $b = Get-Item publish-v4-small/BRZE-Unit-Changer-Lab-v4-TwoOutputProof-Small.exe
          Write-Host ('STANDALONE_BYTES='+$a.Length)
          Write-Host ('SMALL_BYTES='+$b.Length)
          Get-FileHash $a.FullName -Algorithm SHA256
          Get-FileHash $b.FullName -Algorithm SHA256

      - name: Upload V4 proof builds
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Unit-Changer-Lab-v4-TwoOutputProof
          compression-level: 0
          path: |
            publish-v4/BRZE-Unit-Changer-Lab-v4-TwoOutputProof.exe
            publish-v4-small/BRZE-Unit-Changer-Lab-v4-TwoOutputProof-Small.exe
