name: Final V34 Candidate Four-Pack

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.final-v34-candidate-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate locked V20 integrated base
        shell: pwsh
        run: |
          python tools/prepare_merged_v3_wolfstock.py
          python tools/finalize_v10_ui_safe.py
          python tools/finalize_v11_transition_safe.py
          python tools/finalize_v13_integrated.py
          python tools/finalize_v14_building_profiles.py
          python tools/v14_generator_repair.py
          python tools/v14_ui_compile_repair.py
          python tools/finalize_v15_compact_ui.py
          python tools/finalize_v16_unit_catalog.py
          python tools/finalize_v17_wotw_warning.py
          python tools/finalize_v18_quick_tabs.py
          python tools/finalize_v18_2_inline_allslots.py
          python tools/finalize_v18_3_bulk_actions.py
          python tools/finalize_v19_hold_death_layout_v2.py
          python tools/finalize_v20_integrated_features.py

      - name: Apply V22 explicit-target dispatcher facade
        run: python tools/finalize_v22_group_safe_hero.py

      - name: Apply proven V30 Hero reset layer
        run: python tools/finalize_v30_reset_hero.py

      - name: Lock gameplay sources before V34 polish
        shell: pwsh
        run: |
          (Get-FileHash UnitChangerCore.cs -Algorithm SHA256).Hash | Set-Content unit.before
          (Get-FileHash HookCore.cs -Algorithm SHA256).Hash | Set-Content hook.before
          (Get-FileHash InstantDeathCore.cs -Algorithm SHA256).Hash | Set-Content death.before
          (Get-FileHash IntegratedFrameDispatcherCore.cs -Algorithm SHA256).Hash | Set-Content dispatcher.before
          (Get-FileHash HeroEffectDirectCoreV30.cs -Algorithm SHA256).Hash | Set-Content hero.before
          (Get-FileHash IntegratedFeaturePanelsV30.cs -Algorithm SHA256).Hash | Set-Content panel.before
          (Get-FileHash StaminaCore.cs -Algorithm SHA256).Hash | Set-Content stamina.before
          (Get-FileHash RevealMapCore.cs -Algorithm SHA256).Hash | Set-Content reveal.before

      - name: Apply V34 candidate polish
        run: python tools/finalize_v34_candidate.py

      - name: Runtime patch collision audit
        run: python tools/audit_v34_runtime_conflicts.py

      - name: Verify V34 architecture
        shell: pwsh
        run: |
          function Same($before,$file,$name){$a=(Get-Content $before -Raw).Trim();$b=(Get-FileHash $file -Algorithm SHA256).Hash;if($a -ne $b){throw "V34 changed locked $name"}}
          Same unit.before UnitChangerCore.cs UnitChanger
          Same hook.before HookCore.cs HookCore
          Same death.before InstantDeathCore.cs InstantDeathWrapper
          Same dispatcher.before IntegratedFrameDispatcherCore.cs SharedDispatcher
          Same hero.before HeroEffectDirectCoreV30.cs HeroResetCore
          Same panel.before IntegratedFeaturePanelsV30.cs HeroPanels
          Same stamina.before StaminaCore.cs StaminaCore
          Same reveal.before RevealMapCore.cs RevealMapCore

          $ui=Get-Content FinalV18MainForm.cs -Raw
          foreach($x in @('Text="BRZE Trainer — V34 Clean"','Text="BRZE Trainer — V34 Diagnostics"','V34  ·  FINAL CANDIDATE + HARD BRZE REBIND  ·  INTEGRATED','OverlayHotkeyControllerV34.Attach(this);','HeroEffectDirectCoreV30.Shutdown();','IntegratedFrameDispatcherCore.StopAll();','Array.Clear(held,0,held.Length)','GameGate.Probe(true)','ClientSize=new Size(1640,900);')){if($ui -notmatch [regex]::Escape($x)){throw "V34 UI/refresh missing: $x"}}

          $overlay=Get-Content OverlayHotkeyControllerV34.cs -Raw
          foreach($x in @('sealed class HotkeySink : NativeWindow','RegisterHotKey(Handle','GetAsyncKeyState','Opacity=0.91','91% GLASS','−0.1','+0.1','Math.Max(0.1f','Math.Min(64f','offsetValue.Text=$"+X  {copyOffset:0.0}"','IntegratedFrameDispatcherCore.PasteCopied(copyOffset)','DEATH TARGET  //  ALL UNITS','DEATH TARGET  //  ENEMY ONLY','UNIT CHANGER  //  FULL MINI CONTROL','12 BUILDINGS · 9 OUTPUTS · FULL CATALOG')){if($overlay -notmatch [regex]::Escape($x)){throw "V34 overlay missing: $x"}}
          if($overlay -match 'DeathTriggerSingle'){throw 'V34 overlay must not expose direct single-kill action'}
          if($overlay -match '"burst","DEATH BURST"'){throw 'V34 overlay must not expose stale Death Burst quick toggle'}
          if($overlay -match 'Opacity=0.87'){throw 'V34 stale V32 opacity leaked'}
          if($overlay -match 'CreateRemoteThread'){throw 'V34 overlay must not use remote thread creation'}

          $proj=Get-Content MergedTrainerV34.csproj -Raw
          foreach($x in @('HeroEffectDirectCoreV30.cs','IntegratedFeaturePanelsV30.cs','IntegratedFrameDispatcherCore.cs','OverlayHotkeyControllerV34.cs','BRZE-Trainer-FINAL-V34')){if($proj -notmatch [regex]::Escape($x)){throw "V34 project missing: $x"}}
          if($proj -match 'OverlayHotkeyControllerV33.cs'){throw 'V34 must not compile V33 controller'}
          Write-Host 'V34 PASS — gameplay cores byte-locked; 0.1 copy offset; hard BRZE runtime rebind; static patch-collision audit clean'

      - name: Compile CLEAN smoke
        run: dotnet build MergedTrainerV34.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false
      - name: Compile DIAGNOSTICS smoke
        run: dotnet build MergedTrainerV34.csproj -c Release -r win-x86 -p:DefineConstants=RAW_STATUS -p:DebugType=None -p:DebugSymbols=false

      - name: Publish CLEAN standalone
        run: |
          dotnet publish MergedTrainerV34.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean
          Move-Item publish-clean/BRZE-Trainer-FINAL-V34.exe publish-clean/BRZE-Trainer-FINAL-V34-Clean.exe
      - name: Publish DIAGNOSTICS standalone
        run: |
          dotnet publish MergedTrainerV34.csproj -c Release -r win-x86 --self-contained true -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag
          Move-Item publish-diag/BRZE-Trainer-FINAL-V34.exe publish-diag/BRZE-Trainer-FINAL-V34-Diagnostics.exe
      - name: Publish CLEAN small
        run: |
          dotnet publish MergedTrainerV34.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean-small
          Move-Item publish-clean-small/BRZE-Trainer-FINAL-V34.exe publish-clean-small/BRZE-Trainer-FINAL-V34-Clean-Small.exe
      - name: Publish DIAGNOSTICS small
        run: |
          dotnet publish MergedTrainerV34.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag-small
          Move-Item publish-diag-small/BRZE-Trainer-FINAL-V34.exe publish-diag-small/BRZE-Trainer-FINAL-V34-Diagnostics-Small.exe

      - name: Hash outputs
        shell: pwsh
        run: |
          Get-FileHash publish-clean/BRZE-Trainer-FINAL-V34-Clean.exe -Algorithm SHA256
          Get-FileHash publish-diag/BRZE-Trainer-FINAL-V34-Diagnostics.exe -Algorithm SHA256
          Get-FileHash publish-clean-small/BRZE-Trainer-FINAL-V34-Clean-Small.exe -Algorithm SHA256
          Get-FileHash publish-diag-small/BRZE-Trainer-FINAL-V34-Diagnostics-Small.exe -Algorithm SHA256

      - name: Upload V34 four-pack
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-FINAL-V34-Candidate
          compression-level: 0
          path: |
            publish-clean/BRZE-Trainer-FINAL-V34-Clean.exe
            publish-diag/BRZE-Trainer-FINAL-V34-Diagnostics.exe
            publish-clean-small/BRZE-Trainer-FINAL-V34-Clean-Small.exe
            publish-diag-small/BRZE-Trainer-FINAL-V34-Diagnostics-Small.exe
