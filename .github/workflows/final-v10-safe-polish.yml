name: Final V10 Safe Polish

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.final-v10-safe-polish-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify locked runtime-proven cores
        shell: pwsh
        run: |
          $d=Get-Content InstantDeathCore.cs -Raw
          foreach($x in @('RVA_FRAME_MOUSE_DRAW=0x135C43','RVA_CURSOR_UNIT_QUERY=0x135EFB','MODE_IDLE=0,MODE_BURST=1,MODE_SINGLE=2','TriggerSingle()')){if($d -notmatch [regex]::Escape($x)){throw "death regression: $x"}}
          if($d -match 'RVA_CURRENT_UNIT_PTR\s*=\s*0x3DD858'){throw 'rejected V5 death sweep reintroduced'}
          $w=Get-Content WolfCore.cs -Raw
          foreach($x in @('OFF_WOLF_STOCK=0x250','WOLVES_DEN_TYPE=0x44','MAX_WOLF_STOCK=250','W8(den+OFF_WOLF_STOCK,MAX_WOLF_STOCK)')){if($w -notmatch [regex]::Escape($x)){throw "wolves regression: $x"}}
          if($w -match 'RVA_WOLF_CAP_CMP'){throw 'rejected V7 wolf hook reintroduced'}
          $r=Get-Content RevealMapCore.cs -Raw
          if($r -notmatch 'RVA_SET_FOG_OF_WAR=0x10DBD7'){throw 'Reveal Map regression'}

      - name: Generate proven V8 merged base
        run: python tools/prepare_merged_v3_wolfstock.py

      - name: Apply V10 safe polished UI
        run: python tools/finalize_v10_ui_safe.py

      - name: Verify V10 layout hotkeys signature safety
        shell: pwsh
        run: |
          $m=Get-Content MergedProgram.cs -Raw
          foreach($x in @(
            'ClientSize=new Size(1270,770)',
            'new("Rice","F1")','new("Water","F2")','new("Yin / Yang","F3")','new("Population","F4")','new("Training","F7")','new("Peasant 3s","F12")',
            'new("Health","F6")','new("Stamina","F5")','new("Horses","F11")','new("Wolves","F10")','new("Reveal","Insert")','new("Death Burst","End")',
            'new ActionButton("SINGLE KILL","PgDn")','new ActionButton("BUILD NOW","Del / F8")','new ActionButton("ALL ON","F9")','new ActionButton("ALL OFF","Shift + F9")',
            'Create By PokakBg','ZEN EDITION  ·  BRZE 1.60  ·  FINAL PACK',
            'READ_ONLY=0x400|0x10','SAFE STANDBY','No cheat writes or game hooks are active yet.',
            'if(!gate.Ready)','WM_ENTERSIZEMOVE=0x0231','timer.Stop()','timer=new(){Interval=100}',
            'if(text==lastStatus)return','nextProbeUtc=now.AddMilliseconds(400)'
          )){if($m -notmatch [regex]::Escape($x)){throw "V10 invariant missing: $x"}}
          if($m -match 'PgDn Single  ·  Del/F8 Build  ·  PgUp HP\+Stamina'){throw 'old bottom helper text leaked back'}
          if($m -match 'Legacy Infinite Watchtowers|Demolition Mode'){throw 'legacy experimental UI leaked into final'}
          $guard=$m.IndexOf('if(!gate.Ready)')
          $core=$m.IndexOf('string hookStatus=HookCore.Tick')
          if($guard -lt 0 -or $core -lt 0 -or $guard -gt $core){throw 'runtime core is not behind battle-ready guard'}
          $single=$m.IndexOf('void SafeSingle()')
          $singleGate=$m.IndexOf('if(!GameGate.Probe(true).Ready)', $single)
          if($singleGate -lt $single){throw 'single action lacks pre-game guard'}
          $build=$m.IndexOf('void SafeBuild()')
          $buildGate=$m.IndexOf('if(!GameGate.Probe(true).Ready)', $build)
          if($buildGate -lt $build){throw 'build action lacks pre-game guard'}

      - name: Compile smoke
        run: dotnet build MergedTrainer.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false

      - name: Publish standalone compressed
        shell: pwsh
        run: |
          dotnet publish MergedTrainer.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-standalone
          Move-Item publish-standalone/BRZE-Trainer-Merged-v1.exe publish-standalone/BRZE-Trainer-FINAL-V10-Standalone.exe

      - name: Publish ultra-small framework dependent
        shell: pwsh
        run: |
          dotnet publish MergedTrainer.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-small
          Move-Item publish-small/BRZE-Trainer-Merged-v1.exe publish-small/BRZE-Trainer-FINAL-V10-Small.exe

      - name: Report sizes and hashes
        shell: pwsh
        run: |
          $a=Get-Item publish-standalone/BRZE-Trainer-FINAL-V10-Standalone.exe
          $s=Get-Item publish-small/BRZE-Trainer-FINAL-V10-Small.exe
          Write-Host ('STANDALONE_BYTES='+$a.Length)
          Write-Host ('SMALL_BYTES='+$s.Length)
          Write-Host ('STANDALONE_MB='+[math]::Round($a.Length/1MB,2))
          Write-Host ('SMALL_MB='+[math]::Round($s.Length/1MB,3))
          Get-FileHash $a.FullName -Algorithm SHA256
          Get-FileHash $s.FullName -Algorithm SHA256

      - name: Make ZIP copies
        shell: pwsh
        run: |
          Compress-Archive -Path publish-standalone/BRZE-Trainer-FINAL-V10-Standalone.exe -DestinationPath BRZE-Trainer-FINAL-V10-Standalone.zip -CompressionLevel Optimal
          Compress-Archive -Path publish-small/BRZE-Trainer-FINAL-V10-Small.exe -DestinationPath BRZE-Trainer-FINAL-V10-Small.zip -CompressionLevel Optimal

      - name: Upload final V10 pack
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-FINAL-V10-Pack
          compression-level: 0
          path: |
            publish-standalone/BRZE-Trainer-FINAL-V10-Standalone.exe
            publish-small/BRZE-Trainer-FINAL-V10-Small.exe
            BRZE-Trainer-FINAL-V10-Standalone.zip
            BRZE-Trainer-FINAL-V10-Small.zip
