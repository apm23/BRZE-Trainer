name: Final V22 Group Safe Hero Effect

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.final-v22-group-safe-hero-trigger'
      - 'HeroEffectDirectCoreV22.cs'
      - 'IntegratedFeaturePanelsV22.cs'
      - 'MergedTrainerV22.csproj'
      - 'tools/finalize_v22_group_safe_hero.py'
      - '.github/workflows/final-v22-group-safe-hero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate locked V20 integrated base
        shell: pwsh
        run: |
          python tools/prepare_merged_v3_wolfstock.py
          python tools/finalize_v10_ui_safe.py
          python tools/finalize_v11_transition_safe.py
          python tools/finalize_v13_integrated.py
          python tools/finalize_v14_building_profiles.py
          python tools/v14_generator_repair.py
          python tools/v14_ui_compile_repair.py
          python tools/finalize_v15_compact_ui.py
          python tools/finalize_v16_unit_catalog.py
          python tools/finalize_v17_wotw_warning.py
          python tools/finalize_v18_quick_tabs.py
          python tools/finalize_v18_2_inline_allslots.py
          python tools/finalize_v18_3_bulk_actions.py
          python tools/finalize_v19_hold_death_layout_v2.py
          python tools/finalize_v20_integrated_features.py
          (Get-FileHash UnitChangerCore.cs -Algorithm SHA256).Hash | Set-Content unit.before
          (Get-FileHash HookCore.cs -Algorithm SHA256).Hash | Set-Content hook.before
          (Get-FileHash InstantDeathCore.cs -Algorithm SHA256).Hash | Set-Content death.before

      - name: Apply V22 group-safe hero finalizer
        run: python tools/finalize_v22_group_safe_hero.py

      - name: Verify V22 architecture
        shell: pwsh
        run: |
          function Same($before,$file,$name){$a=(Get-Content $before -Raw).Trim();$b=(Get-FileHash $file -Algorithm SHA256).Hash;if($a -ne $b){throw "V22 changed locked $name"}}
          Same unit.before UnitChangerCore.cs UnitChanger
          Same hook.before HookCore.cs HookCore
          Same death.before InstantDeathCore.cs InstantDeathWrapper

          $ui=Get-Content FinalV18MainForm.cs -Raw
          foreach($x in @('Text="BRZE Trainer — V22 Clean"','Text="BRZE Trainer — V22 Diagnostics"','ClientSize=new Size(1640,900);','content.SetColumnSpan(statusPanel,2)','TextAlign=ContentAlignment.MiddleCenter,AutoEllipsis=false')){if($ui -notmatch [regex]::Escape($x)){throw "V22 UI missing: $x"}}

          $panel=Get-Content IntegratedFeaturePanelsV22.cs -Raw
          foreach($x in @('HERO EFFECT  //  DIRECT APPLY','APPLY ISSYL','APPLY GRAYBACK','APPLY BOTH','DURATION (SEC)','same ability to another group if the duration is unchanged','COPY UNIT  //  UNIT CLONE LAB')){if($panel -notmatch [regex]::Escape($x)){throw "V22 panel missing: $x"}}
          foreach($bad in @('CAPTURE ISSYL BASELINE','RESTORE 15000','SetEnabled(!HeroEffectDirectCore','IntegratedReplayLifetimeWatcher')){if($panel -match [regex]::Escape($bad)){throw "V22 stale research/blocking UI leaked: $bad"}}

          $core=Get-Content HeroEffectDirectCoreV22.cs -Raw
          foreach($x in @('ABILITY_OFF=0x058,TARGET_OFF=0x17C','TryFindRecord','SignatureMatches','RequestedAlreadyActive','same duration or wait','QueueReplayUnits','RestoreHold','Held','EXPIRY_MISSING_SAMPLES=4')){if($core -notmatch [regex]::Escape($x)){throw "V22 core missing: $x"}}
          if($core -match 'RootsClean|active transient effect — wait'){throw 'V22 reintroduced generic transient-root blocking'}
          if($core -match 'CreateRemoteThread'){throw 'V22 must not use CreateRemoteThread'}

          $dispatch=Get-Content IntegratedFrameDispatcherCore.cs -Raw
          foreach($x in @('public static string QueueReplayUnits','QueueReplayUnitsLocked','queued {units.Count} explicit targets','RVA_FRAME_MOUSE_DRAW=0x135C43')){if($dispatch -notmatch [regex]::Escape($x)){throw "V22 dispatcher patch missing: $x"}}
          $owners=($dispatch | Select-String -Pattern 'RVA_FRAME_MOUSE_DRAW=0x135C43' -AllMatches).Matches.Count
          if($owners -ne 1){throw "Expected one shared frame-hook owner in dispatcher, got $owners"}

          $proj=Get-Content MergedTrainerV22.csproj -Raw
          foreach($x in @('HeroEffectDirectCoreV22.cs','IntegratedFeaturePanelsV22.cs','IntegratedFrameDispatcherCore.cs')){if($proj -notmatch [regex]::Escape($x)){throw "V22 project missing: $x"}}
          if($proj -match 'ConfigurableDurationCore|IntegratedFeaturePanelsV21|HeroEffectDirectCore.cs'){throw 'V22 project compiles stale Hero Effect implementation'}
          Write-Host 'V22 PASS — signature tracking, multi-select skip-not-block, concurrent same-duration groups, independent Issyl/Grayback holds, one shared dispatcher'

      - name: Compile CLEAN smoke
        run: dotnet build MergedTrainerV22.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false
      - name: Compile DIAGNOSTICS smoke
        run: dotnet build MergedTrainerV22.csproj -c Release -r win-x86 -p:DefineConstants=RAW_STATUS -p:DebugType=None -p:DebugSymbols=false

      - name: Publish CLEAN standalone
        run: |
          dotnet publish MergedTrainerV22.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean
          Move-Item publish-clean/BRZE-Trainer-FINAL-V22.exe publish-clean/BRZE-Trainer-FINAL-V22-Clean.exe
      - name: Publish DIAGNOSTICS standalone
        run: |
          dotnet publish MergedTrainerV22.csproj -c Release -r win-x86 --self-contained true -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag
          Move-Item publish-diag/BRZE-Trainer-FINAL-V22.exe publish-diag/BRZE-Trainer-FINAL-V22-Diagnostics.exe
      - name: Publish CLEAN small
        run: |
          dotnet publish MergedTrainerV22.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-clean-small
          Move-Item publish-clean-small/BRZE-Trainer-FINAL-V22.exe publish-clean-small/BRZE-Trainer-FINAL-V22-Clean-Small.exe
      - name: Publish DIAGNOSTICS small
        run: |
          dotnet publish MergedTrainerV22.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:DefineConstants=RAW_STATUS -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-diag-small
          Move-Item publish-diag-small/BRZE-Trainer-FINAL-V22.exe publish-diag-small/BRZE-Trainer-FINAL-V22-Diagnostics-Small.exe

      - name: Hash outputs
        shell: pwsh
        run: |
          Get-FileHash publish-clean/BRZE-Trainer-FINAL-V22-Clean.exe -Algorithm SHA256
          Get-FileHash publish-diag/BRZE-Trainer-FINAL-V22-Diagnostics.exe -Algorithm SHA256
          Get-FileHash publish-clean-small/BRZE-Trainer-FINAL-V22-Clean-Small.exe -Algorithm SHA256
          Get-FileHash publish-diag-small/BRZE-Trainer-FINAL-V22-Diagnostics-Small.exe -Algorithm SHA256

      - name: Upload V22 four-pack
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-FINAL-V22-GroupSafeHero
          compression-level: 0
          path: |
            publish-clean/BRZE-Trainer-FINAL-V22-Clean.exe
            publish-diag/BRZE-Trainer-FINAL-V22-Diagnostics.exe
            publish-clean-small/BRZE-Trainer-FINAL-V22-Clean-Small.exe
            publish-diag-small/BRZE-Trainer-FINAL-V22-Diagnostics-Small.exe
