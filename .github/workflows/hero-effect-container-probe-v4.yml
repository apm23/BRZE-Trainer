name: Hero Effect Container Probe V4 Read Only

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - 'HeroEffectContainerProbeV4/**'
      - '.hero-effect-container-probe-v4-trigger'
      - '.github/workflows/hero-effect-container-probe-v4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify strict read-only architecture
        shell: pwsh
        run: |
          $src = Get-Content 'HeroEffectContainerProbeV4/ProbeCore.cs' -Raw
          $forbidden = @('WriteProcessMemory','VirtualAllocEx','VirtualProtectEx','CreateRemoteThread','FlushInstructionCache','RVA_TARGET_HELPER','RVA_MAGIC_CREATE')
          foreach ($token in $forbidden) {
            if ($src.Contains($token)) { throw "Forbidden token in V4 read-only probe: $token" }
          }
          if (-not $src.Contains('PROCESS_VM_READ')) { throw 'PROCESS_VM_READ invariant missing' }
          if (-not $src.Contains('PROCESS_QUERY_INFORMATION')) { throw 'PROCESS_QUERY_INFORMATION invariant missing' }
          Write-Host 'Read-only invariant PASS'

      - name: Compile smoke
        run: dotnet build HeroEffectContainerProbeV4/HeroEffectContainerProbeV4.csproj -c Release -p:Platform=x86

      - name: Publish standalone
        run: dotnet publish HeroEffectContainerProbeV4/HeroEffectContainerProbeV4.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o out/standalone

      - name: Publish small
        run: dotnet publish HeroEffectContainerProbeV4/HeroEffectContainerProbeV4.csproj -c Release -r win-x86 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o out/small

      - name: Stage outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item 'out/standalone/BRZE-Hero-Effect-Container-Probe-V4.exe' 'artifact/BRZE-Hero-Effect-Container-Probe-V4-ReadOnly.exe'
          Copy-Item 'out/small/BRZE-Hero-Effect-Container-Probe-V4.exe' 'artifact/BRZE-Hero-Effect-Container-Probe-V4-ReadOnly-Small.exe'

      - name: Hash outputs
        shell: pwsh
        run: |
          Get-FileHash artifact/*.exe -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload probe V4
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Hero-Effect-Container-Probe-V4-ReadOnly
          path: artifact/*
          if-no-files-found: error
