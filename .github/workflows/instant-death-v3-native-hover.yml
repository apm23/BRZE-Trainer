name: Instant Death v3 — Native Hover Probe

on:
  push:
    branches:
      - instant-death-v3-native-hover
    paths:
      - '.instant-death-v3-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v3-native-hover
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify surgical death source
        shell: pwsh
        run: |
          $d = Get-Content InstantDeathCore.cs -Raw
          if ($d -notmatch 'RVA_HOVER_QUERY_CALL=0x135F27') { throw 'missing native hover call RVA' }
          if ($d -notmatch 'RVA_HOVER_QUERY=0x1D4888') { throw 'missing native hover resolver RVA' }
          if ($d -notmatch 'RVA_PLAYER_RELATION=0x1848E8') { throw 'missing alliance relation guard' }
          if ($d -notmatch 'DEATH_SENTINEL=0xFF000000') { throw 'missing legacy death sentinel' }
          if ($d -notmatch 'OriginalCall=\{0xE8,0x5C,0xE9,0x09,0x00\}') { throw 'original call bytes not pinned' }
          if ($d -match 'UNIT_COUNT.*2000') { throw 'death core must not scan unit pool' }

      - name: Generate merged source
        run: python tools/prepare_merged_v1.py

      - name: Verify deferred cheats removed from UI and death wired
        shell: pwsh
        run: |
          $m = Get-Content MergedProgram.cs -Raw
          if ($m -match 'panel\.Controls\.AddRange[^\r\n]*legacyTower') { throw 'watchtower still visible' }
          if ($m -match 'panel\.Controls\.AddRange[^\r\n]*demolish') { throw 'demolition still visible' }
          if ($m -match 'Toggle\(0x7A,14') { throw 'demolition F11 hotkey still active' }
          if ($m -notmatch 'InstantDeathCore\.Tick\(instantDeath\.Checked\)') { throw 'death core not wired' }
          if ($m -notmatch 'Toggle\(0x22,12,\(\)=>instantDeath\.Checked=!instantDeath\.Checked\)') { throw 'PageDown death toggle not wired' }
          if ($m -notmatch 'ApplyLegacyRuntime\(pausePeasant\.Checked,false,false,false\)') { throw 'deferred legacy writes not disabled' }

      - name: Compile smoke
        run: dotnet build MergedTrainer.csproj -c Release -r win-x86

      - name: Publish x86 single-file
        run: dotnet publish MergedTrainer.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item publish/BRZE-Trainer-Merged-v1.exe publish/BRZE-Trainer-InstantDeathV3-NativeHover.exe
          Get-FileHash publish/BRZE-Trainer-InstantDeathV3-NativeHover.exe -Algorithm SHA256

      - name: Upload trainer
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-InstantDeathV3-NativeHover
          path: publish/BRZE-Trainer-InstantDeathV3-NativeHover.exe
