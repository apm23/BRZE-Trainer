name: Hero Effect Replay V3 Duration

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.hero-effect-replay-v3-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify duration architecture
        shell: pwsh
        run: |
          $s=Get-Content HeroEffectReplayV3/ReplayCore.cs -Raw
          foreach($x in @(
            'GRAYBACK_RUNTIME_ABILITY=0xC0',
            'ISSYL_RUNTIME_ABILITY=0xA5',
            'RVA_APPLY_TARGET_ABILITY=0x1F0C32',
            'RVA_SELECTION_LIST=0x441708',
            'MAX_SELECTED=120',
            'FXSCRATCH=0x2000',
            'CapturedUnit',
            'QueueHeld',
            'OFF_DEF=0x74',
            'OFF_OWNER=0x240'
          )){if($s -notmatch [regex]::Escape($x)){throw "duration invariant missing: $x"}}
          if($s -match 'CreateRemoteThread|OFF_HP|OFF_STAMINA'){throw 'duration build must preserve native ability path only'}

      - name: Compile smoke
        run: dotnet build HeroEffectReplayV3/HeroEffectReplayV3.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false

      - name: Publish standalone
        run: |
          dotnet publish HeroEffectReplayV3/HeroEffectReplayV3.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-standalone
          Move-Item publish-standalone/BRZE-Hero-Effect-Replay-V3-Duration.exe publish-standalone/BRZE-Hero-Effect-Replay-V3-Duration-Hold.exe

      - name: Publish small
        run: |
          dotnet publish HeroEffectReplayV3/HeroEffectReplayV3.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-small
          Move-Item publish-small/BRZE-Hero-Effect-Replay-V3-Duration.exe publish-small/BRZE-Hero-Effect-Replay-V3-Duration-Hold-Small.exe

      - name: Hash outputs
        shell: pwsh
        run: |
          Get-FileHash publish-standalone/BRZE-Hero-Effect-Replay-V3-Duration-Hold.exe -Algorithm SHA256
          Get-FileHash publish-small/BRZE-Hero-Effect-Replay-V3-Duration-Hold-Small.exe -Algorithm SHA256

      - name: Upload V3 duration lab
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Hero-Effect-Replay-V3-Duration-Hold
          compression-level: 0
          path: |
            publish-standalone/BRZE-Hero-Effect-Replay-V3-Duration-Hold.exe
            publish-small/BRZE-Hero-Effect-Replay-V3-Duration-Hold-Small.exe
