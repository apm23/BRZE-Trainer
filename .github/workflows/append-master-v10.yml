name: Append V10 Master Ledger

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.master-v10-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
          fetch-depth: 0
      - name: Append V10 milestone if absent
        run: python tools/append_master_v10.py
      - name: Commit ledger
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_STATE.md
          git commit -m 'Record final V10 safe polish milestone'
          git push origin HEAD:instant-death-v4-hover-telemetry
