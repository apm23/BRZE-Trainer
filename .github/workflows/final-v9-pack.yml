name: Final V9 Pack

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.final-v9-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify locked runtime-proven cores
        shell: pwsh
        run: |
          $d = Get-Content InstantDeathCore.cs -Raw
          foreach ($x in @('RVA_FRAME_MOUSE_DRAW=0x135C43','RVA_CURSOR_UNIT_QUERY=0x135EFB','MODE_IDLE=0,MODE_BURST=1,MODE_SINGLE=2','TriggerSingle()')) { if ($d -notmatch [regex]::Escape($x)) { throw "death regression: $x" } }
          if ($d -match 'RVA_CURRENT_UNIT_PTR\s*=\s*0x3DD858') { throw 'rejected V5 death sweep reintroduced' }
          $w = Get-Content WolfCore.cs -Raw
          foreach ($x in @('OFF_WOLF_STOCK=0x250','WOLVES_DEN_TYPE=0x44','MAX_WOLF_STOCK=250','W8(den+OFF_WOLF_STOCK,MAX_WOLF_STOCK)')) { if ($w -notmatch [regex]::Escape($x)) { throw "wolves regression: $x" } }
          if ($w -match 'RVA_WOLF_CAP_CMP') { throw 'rejected V7 wolf hook reintroduced' }
          $r = Get-Content RevealMapCore.cs -Raw
          if ($r -notmatch 'RVA_SET_FOG_OF_WAR=0x10DBD7') { throw 'Reveal Map regression' }

      - name: Generate V8 proven merged base
        run: python tools/prepare_merged_v3_wolfstock.py

      - name: Apply V9 final UI
        run: python tools/finalize_v9_ui.py

      - name: Verify final UI structure and wiring
        shell: pwsh
        run: |
          $m = Get-Content MergedProgram.cs -Raw
          foreach ($x in @('BATTLE REALMS  //  TRAINER','SYSTEM STATUS','SINGLE KILL','BUILD NOW','ALL ON','ALL OFF','new("Rice","F1")','new("Death Burst","")','WolfCore.Tick(wolves.Checked)','RevealMapCore.Tick(reveal.Checked)','InstantDeathCore.Tick(burst.Checked)','InstantDeathCore.TriggerSingle()','Native.InstantSelectedBuilding()','BattleBackdrop','ToggleSwitch')) { if ($m -notmatch [regex]::Escape($x)) { throw "final UI missing: $x" } }
          if ($m -match 'Legacy Infinite Watchtowers|Demolition Mode') { throw 'legacy experimental UI leaked into final' }

      - name: Compile smoke
        run: dotnet build MergedTrainer.csproj -c Release -r win-x86 -p:DebugType=None -p:DebugSymbols=false

      - name: Publish standalone compressed single-file
        shell: pwsh
        run: |
          dotnet publish MergedTrainer.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-standalone
          Move-Item publish-standalone/BRZE-Trainer-Merged-v1.exe publish-standalone/BRZE-Trainer-FINAL-V9-Standalone.exe

      - name: Publish small framework-dependent single-file
        shell: pwsh
        run: |
          dotnet publish MergedTrainer.csproj -c Release -r win-x86 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o publish-small
          Move-Item publish-small/BRZE-Trainer-Merged-v1.exe publish-small/BRZE-Trainer-FINAL-V9-Small.exe

      - name: Report sizes and hashes
        shell: pwsh
        run: |
          $a=Get-Item publish-standalone/BRZE-Trainer-FINAL-V9-Standalone.exe
          $s=Get-Item publish-small/BRZE-Trainer-FINAL-V9-Small.exe
          Write-Host ('STANDALONE_BYTES=' + $a.Length)
          Write-Host ('SMALL_BYTES=' + $s.Length)
          Write-Host ('STANDALONE_MB=' + [math]::Round($a.Length/1MB,2))
          Write-Host ('SMALL_MB=' + [math]::Round($s.Length/1MB,2))
          Get-FileHash $a.FullName -Algorithm SHA256
          Get-FileHash $s.FullName -Algorithm SHA256
          if ($s.Length -gt 10MB) { Write-Warning 'Small build is above 10 MB; this is the smallest safe framework-dependent publish path currently used.' }

      - name: Make optimal ZIP copies
        shell: pwsh
        run: |
          Compress-Archive -Path publish-standalone/BRZE-Trainer-FINAL-V9-Standalone.exe -DestinationPath BRZE-Trainer-FINAL-V9-Standalone.zip -CompressionLevel Optimal
          Compress-Archive -Path publish-small/BRZE-Trainer-FINAL-V9-Small.exe -DestinationPath BRZE-Trainer-FINAL-V9-Small.zip -CompressionLevel Optimal

      - name: Upload final pack
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-FINAL-V9-Pack
          compression-level: 0
          path: |
            publish-standalone/BRZE-Trainer-FINAL-V9-Standalone.exe
            publish-small/BRZE-Trainer-FINAL-V9-Small.exe
            BRZE-Trainer-FINAL-V9-Standalone.zip
            BRZE-Trainer-FINAL-V9-Small.zip
