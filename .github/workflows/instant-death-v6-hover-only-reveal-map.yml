name: Instant Death v6 — Hover Only + Reveal Map

on:
  push:
    branches:
      - instant-death-v4-hover-telemetry
    paths:
      - '.instant-death-v6-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instant-death-v4-hover-telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify V6 hover-only architecture
        shell: pwsh
        run: |
          $d = Get-Content InstantDeathCore.cs -Raw
          if ($d -match '3DD858|RVA_CURRENT_UNIT_PTR') { throw 'rejected V5 sweeping pointer reintroduced' }
          if ($d -notmatch 'RVA_FRAME_MOUSE_DRAW=0x135C43') { throw 'missing per-frame game-thread hook' }
          if ($d -notmatch 'RVA_INTERFACE_MOUSE=0x443640') { throw 'missing InterfaceMouse object' }
          if ($d -notmatch 'RVA_CURSOR_UNIT_QUERY=0x135EFB') { throw 'missing native live cursor query' }
          if ($d -notmatch 'RVA_RELATION=0x1848E8') { throw 'missing alliance filter' }
          if ($d -notmatch 'OFF_OWNER=0x240,OFF_HP=0x404,OFF_STAMINA=0x408') { throw 'missing current unit fields' }
          if ($d -notmatch 'DEATH_SENTINEL=0xFF000000') { throw 'missing exact death sentinel' }
          if ($d -match 'UNIT_COUNT|RVA_UNIT_POOL') { throw 'V6 must not scan or depend on the unit pool' }

      - name: Verify Reveal Map native path
        shell: pwsh
        run: |
          $r = Get-Content RevealMapCore.cs -Raw
          if ($r -notmatch 'RVA_SET_FOG_OF_WAR=0x10DBD7') { throw 'missing native FOW setter' }
          if ($r -notmatch 'CreateRemoteThread') { throw 'native FOW invocation missing' }
          $p = Get-Content MergedTrainer.csproj -Raw
          if ($p -notmatch 'Compile Include="RevealMapCore.cs"') { throw 'RevealMapCore not compiled' }

      - name: Generate merged source
        run: python tools/prepare_merged_v1.py

      - name: Verify V6 UI wiring and deferred cheats
        shell: pwsh
        run: |
          $m = Get-Content MergedProgram.cs -Raw
          if ($m -notmatch 'Instant Death V6 — HOVER ONLY') { throw 'V6 UI label missing' }
          if ($m -notmatch 'Reveal Map — disable Fog of War') { throw 'Reveal Map checkbox missing' }
          if ($m -notmatch 'InstantDeathCore\.Tick\(instantDeath\.Checked\)') { throw 'V6 death core not wired' }
          if ($m -notmatch 'RevealMapCore\.Tick\(revealMap\.Checked\)') { throw 'Reveal Map core not wired' }
          if ($m -notmatch 'RevealMapCore\.Stop\(\)') { throw 'Reveal Map shutdown restore missing' }
          if ($m -notmatch 'Toggle\(0x22,12,\(\)=>instantDeath\.Checked=!instantDeath\.Checked\)') { throw 'PageDown toggle missing' }
          if ($m -match 'panel\.Controls\.AddRange[^\r\n]*legacyTower') { throw 'watchtower visible again' }
          if ($m -match 'panel\.Controls\.AddRange[^\r\n]*demolish') { throw 'demolition visible again' }
          if ($m -match 'Toggle\(0x7A,14') { throw 'demolition F11 active again' }
          if ($m -notmatch 'ApplyLegacyRuntime\(pausePeasant\.Checked,false,false,false\)') { throw 'deferred legacy writes not forced off' }

      - name: Compile smoke
        run: dotnet build MergedTrainer.csproj -c Release -r win-x86

      - name: Publish x86 single-file
        run: dotnet publish MergedTrainer.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item publish/BRZE-Trainer-Merged-v1.exe publish/BRZE-Trainer-InstantDeathV6-HoverOnly-RevealMap.exe
          Get-FileHash publish/BRZE-Trainer-InstantDeathV6-HoverOnly-RevealMap.exe -Algorithm SHA256

      - name: Upload trainer
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Trainer-InstantDeathV6-HoverOnly-RevealMap
          path: publish/BRZE-Trainer-InstantDeathV6-HoverOnly-RevealMap.exe
