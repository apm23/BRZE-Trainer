name: F5 F6 legacy PageUp remap
on:
  workflow_dispatch:
  push:
    paths:
      - '.trigger-f56-legacy-pageup'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Program.cs
        run: python3 tools/patch_f56_legacy_pageup.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Program.cs
          git diff --cached --quiet || git commit -m "Remap F5 F6 using legacy PageUp game-side hooks"
          git push
