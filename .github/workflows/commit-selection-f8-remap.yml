name: Commit selection-list and F8 legacy remap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commit-selection-f8-remap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('Program.cs')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing anchor: '+old[:120])
              s=s.replace(old,new,1)

          rep('panel.Controls.Add(new Label { Text = "F8 Instant Building — pending", AutoSize = true, ForeColor = Color.DimGray });',
              'panel.Controls.Add(new Label { Text = "F8 Instant Build/Repair/Research — PUSH TEST (selected building)", AutoSize = true });')
          rep('Toggle(0x76,7,()=>f7.Checked=!f7.Checked);',
              'Toggle(0x76,7,()=>f7.Checked=!f7.Checked); Toggle(0x77,8,()=>Native.InstantSelectedBuilding());')

          rep('const int RVA_UNIT_POOL=0x4796A0,UNIT_STRIDE=0x818,UNIT_COUNT=2000,OFF_DEF=0x74,OFF_OWNER=0x240,OFF_SEL_A=0x3A8,OFF_SEL_B=0x3AC,OFF_HP=0x404,OFF_ST=0x408;',
              'const int RVA_UNIT_POOL=0x4796A0,UNIT_STRIDE=0x818,UNIT_COUNT=2000,OFF_DEF=0x74,OFF_OWNER=0x240,OFF_SEL_A=0x3A8,OFF_SEL_B=0x3AC,OFF_HP=0x404,OFF_ST=0x408,RVA_SELECTION_LIST=0x441708,RVA_SELECTED_BUILDING_A=0x4417D4,RVA_SELECTED_BUILDING_B=0x4417D8;')

          start=s.index('    static void TopupLoop()')
          end=s.index('\n    static void ApplyInstantUnitTraining',start)
          replacement='''    static void TopupLoop()\n    {\n        while(running)\n        {\n            if(!wantHp&&!wantStamina){selectedLocked=0;Thread.Sleep(100);continue;}\n            if(!Attach()){selectedLocked=0;Thread.Sleep(200);continue;}\n            uint lid=R32(moduleBase+RVA_LOCAL_ID); long list=moduleBase+RVA_SELECTION_LIST;\n            uint count=R32(list+0x18),node=R32(list); int seen=0,locked=0;\n            int limit=(int)Math.Min(count,256u);\n            while(node!=0&&seen<limit)\n            {\n                uint next=R32((long)node); uint unit=R32((long)node+8); seen++;\n                if(unit!=0&&R32((long)unit+OFF_OWNER)==lid&&R32((long)unit+OFF_SEL_A)==1&&R32((long)unit+OFF_SEL_B)==1)\n                {\n                    locked++; uint def=R32((long)unit+OFF_DEF);\n                    if(def!=0)\n                    {\n                        if(wantHp){uint mh=Fixed16(R32((long)def+0x6C)),hp=R32((long)unit+OFF_HP);if(mh!=0&&hp<mh)W32((long)unit+OFF_HP,mh);}\n                        if(wantStamina){uint ms=Fixed16(R32((long)def+0x80)),st=R32((long)unit+OFF_ST);if(ms!=0&&st<ms)W32((long)unit+OFF_ST,ms);}\n                    }\n                }\n                node=next;\n            }\n            selectedLocked=locked; Thread.Sleep(100);\n        }\n    }\n\n    public static void InstantSelectedBuilding()\n    {\n        if(!Attach())return; uint lid=R32(moduleBase+RVA_LOCAL_ID);\n        uint a=R32(moduleBase+RVA_SELECTED_BUILDING_A),b=R32(moduleBase+RVA_SELECTED_BUILDING_B);\n        Boost(a,lid); if(b!=a)Boost(b,lid);\n    }\n    static void Boost(uint obj,uint lid)\n    {\n        if(obj==0||R32((long)obj+0x84)!=lid)return;\n        W32((long)obj+0x8E,5000); W32((long)obj+0x492,100); W32((long)obj+0x4BE,100);\n    }\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          '@ | python

      - name: Compile smoke
        shell: pwsh
        run: dotnet build BRZETrainer.csproj -c Release -r win-x86

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program.cs
          git commit -m "Use native selection list and map legacy instant-building push" || exit 0
          git push
