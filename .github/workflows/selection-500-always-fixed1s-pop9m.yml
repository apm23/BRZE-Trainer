name: Selection 500 Always + Fixed1s Peasant + Pop9M

on:
  push:
    branches:
      - selection-500-always-fixed1s-pop9m
    paths:
      - '.github/workflows/selection-500-always-fixed1s-pop9m.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: selection-500-always-fixed1s-pop9m
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply exact Pop9M delta
        shell: pwsh
        run: |
          $p = 'Selection500AlwaysFixedPeasant.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('F4 Max Population 500 (Selection 500 is ALWAYS ON)', 'F4 Max Population 9,999,999 (Selection 500 is ALWAYS ON)')
          $s = $s.Replace('F4 only toggles Max Population 500.', 'F4 only toggles Max Population 9,999,999.')
          $s = $s.Replace('SELECTION_LIMIT = 500, POPULATION_LIMIT = 500, LOGICAL_WINDOW = 160', 'SELECTION_LIMIT = 500, POPULATION_LIMIT = 9_999_999, LOGICAL_WINDOW = 160')
          Set-Content $p $s -NoNewline
          if (-not ((Get-Content $p -Raw).Contains('POPULATION_LIMIT = 9_999_999'))) { throw 'Pop9M replacement failed' }
          if (-not ((Get-Content $p -Raw).Contains('SELECTION_LIMIT = 500'))) { throw 'Selection500 changed unexpectedly' }
      - name: Compile smoke
        run: dotnet build Selection500AlwaysFixedPeasant.csproj -c Release -r win-x86
      - name: Publish x86 single-file EXE
        run: dotnet publish Selection500AlwaysFixedPeasant.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-pop9m
      - name: Rename artifact EXE
        shell: pwsh
        run: Move-Item 'publish-pop9m/BRZE-Selection-500-Always-Fixed1s-Peasant.exe' 'publish-pop9m/BRZE-Selection-500-Always-Fixed1s-Peasant-Pop9M.exe'
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BRZE-Selection-500-Always-Fixed1s-Peasant-Pop9M
          path: publish-pop9m/BRZE-Selection-500-Always-Fixed1s-Peasant-Pop9M.exe
